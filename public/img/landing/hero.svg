<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">Dari gudang sampai site proyek</title>
  <desc id="d">Ilustrasi gudang dengan rak dan barang, truk pengiriman di jalan, dan lokasi proyek dengan crane serta rangka bangunan.</desc>
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#0f2f2c"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- matahari & bukit -->
  <circle cx="455" cy="150" r="62" fill="url(#sun)" opacity=".9"/>
  <path d="M0 330 C120 280 220 300 320 312 C430 326 520 270 640 286 C720 296 770 312 800 318 V440 H0Z" fill="#115e59" opacity=".55"/>
  <path d="M0 350 H800 V440 H0Z" fill="url(#ground)"/>

  <!-- jalan -->
  <path d="M40 392 H770" stroke="#0b2522" stroke-width="26" stroke-linecap="round"/>
  <path d="M60 392 H750" stroke="#fbbf24" stroke-width="3" stroke-dasharray="18 16" stroke-linecap="round"/>

  <!-- gudang -->
  <g>
    <path d="M40 350 V222 L150 170 L260 222 V350Z" fill="url(#wall)"/>
    <path d="M28 226 L150 164 L272 226" fill="none" stroke="#ea580c" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="96" y="262" width="108" height="88" rx="4" fill="#1e293b"/>
    <g stroke="#475569" stroke-width="3">
      <path d="M104 290 H196 M104 318 H196"/>
      <path d="M104 262 V350 M196 262 V350"/>
    </g>
    <rect x="110" y="272" width="22" height="16" rx="2" fill="#f59e0b"/>
    <rect x="136" y="274" width="18" height="14" rx="2" fill="#fb923c"/>
    <rect x="164" y="270" width="24" height="18" rx="2" fill="#2dd4bf"/>
    <rect x="112" y="300" width="30" height="16" rx="2" fill="#2dd4bf"/>
    <rect x="150" y="302" width="16" height="14" rx="2" fill="#f59e0b"/>
    <rect x="170" y="298" width="20" height="18" rx="2" fill="#fb923c"/>
    <rect x="108" y="328" width="84" height="6" rx="3" fill="#94a3b8"/>
    <rect x="108" y="338" width="84" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="128" y="200" width="44" height="30" rx="4" fill="#0f766e"/>
    <path d="M140 222 V208 M150 222 V212 M160 222 V204" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- truk -->
  <g>
    <rect x="330" y="322" width="120" height="58" rx="6" fill="#f59e0b"/>
    <rect x="344" y="334" width="92" height="8" rx="4" fill="#fde68a" opacity=".8"/>
    <path d="M450 336 H486 L510 356 V380 H450Z" fill="#ea580c"/>
    <path d="M458 344 H482 L498 358 H458Z" fill="#bae6fd"/>
    <circle cx="364" cy="384" r="14" fill="#0f172a"/>
    <circle cx="364" cy="384" r="6" fill="#cbd5e1"/>
    <circle cx="480" cy="384" r="14" fill="#0f172a"/>
    <circle cx="480" cy="384" r="6" fill="#cbd5e1"/>
    <path d="M302 340 H322 M296 354 H322 M306 368 H322" stroke="#fde68a" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  </g>

  <!-- site proyek: crane & rangka -->
  <g>
    <path d="M700 350 V120" stroke="#fbbf24" stroke-width="8"/>
    <path d="M700 120 H560 M700 120 H750" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <path d="M700 120 L640 120 L700 150" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <rect x="740" y="120" width="18" height="24" rx="2" fill="#475569"/>
    <path d="M590 124 V206" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="570" y="206" width="40" height="10" rx="2" fill="#94a3b8"/>
    <g fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round">
      <path d="M560 350 V236 M620 350 V236 M680 350 V236"/>
      <path d="M560 236 H680 M560 274 H680 M560 312 H680"/>
    </g>
    <g stroke="#fb923c" stroke-width="3" opacity=".9">
      <path d="M560 274 L620 236 M620 312 L680 274 M560 350 L620 312"/>
    </g>
    <rect x="720" y="334" width="46" height="16" rx="3" fill="#0f766e"/>
    <rect x="724" y="320" width="38" height="14" rx="3" fill="#14b8a6"/>
  </g>

  <!-- penanda titik -->
  <g fill="#fff">
    <circle cx="150" cy="140" r="16" fill="#0f766e" stroke="#fff" stroke-width="3"/>
    <path d="M143 140 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="654" cy="206" r="16" fill="#ea580c" stroke="#fff" stroke-width="3"/>
    <path d="M647 206 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
