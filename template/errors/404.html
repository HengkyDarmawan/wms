<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Not Found | NexaDash</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <link href="../assets/css/variables.css" rel="stylesheet">
  <link href="../assets/css/layout.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/pages.css" rel="stylesheet">
  <link href="../assets/css/motion.css" rel="stylesheet">
  <link href="../assets/css/dark.css" rel="stylesheet">
  <script src="../assets/js/theme-init.js"></script>
</head>
<body class="" data-nx-root="../">

  <main class="nx-error-page">
    <a class="d-inline-flex align-items-center gap-2 text-decoration-none mb-4" href="../index.html">
      <img src="../assets/img/logo.svg" alt="" width="32" height="32">
      <span class="h4 mb-0" style="color:var(--nx-text)">NexaDash</span>
    </a>

    <svg width="200" height="140" viewBox="0 0 200 140" fill="none" aria-hidden="true">
      <rect x="20" y="24" width="160" height="100" rx="12" fill="var(--nx-primary-subtle)"/>
      <rect x="20" y="24" width="160" height="24" rx="12" fill="var(--nx-primary)" opacity=".25"/>
      <circle cx="36" cy="36" r="4" fill="var(--nx-primary)"/>
      <circle cx="50" cy="36" r="4" fill="var(--nx-primary)" opacity=".6"/>
      <circle cx="64" cy="36" r="4" fill="var(--nx-primary)" opacity=".4"/>
      <path d="M70 90q30-34 60 0" stroke="var(--nx-primary)" stroke-width="5" stroke-linecap="round" fill="none"/>
      <circle cx="78" cy="70" r="5" fill="var(--nx-primary)"/>
      <circle cx="122" cy="70" r="5" fill="var(--nx-primary)"/>
    </svg>

    <div class="nx-error-code">404</div>
    <h1>Page not found</h1>
    <p>The page you are looking for was moved, renamed, or never existed in the first place.</p>

    <div class="d-flex flex-wrap gap-2 justify-content-center mt-3">
      <a class="btn btn-primary d-inline-flex align-items-center gap-1" href="../index.html"><i class="bi bi-house-door"></i>Back to dashboard</a>
      <a class="btn btn-soft-secondary d-inline-flex align-items-center gap-1" href="../pages/faq.html"><i class="bi bi-life-preserver"></i>Visit help centre</a>
    </div>

    <p class="text-muted small mt-4 mb-0">Error code: <code>NX-404-PAGE</code></p>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="../assets/js/app.js"></script>
</body>
</html>
