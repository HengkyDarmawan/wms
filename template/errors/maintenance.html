<body class="" data-nx-root="../">

  <main class="nx-error-page">
    <a class="d-inline-flex align-items-center gap-2 text-decoration-none mb-4" href="../index.html">
      <img src="../assets/img/logo.svg" alt="" width="32" height="32">
      <span class="h4 mb-0" style="color:var(--nx-text)">NexaDash</span>
    </a>

    <svg width="200" height="140" viewBox="0 0 200 140" fill="none" aria-hidden="true">
      <circle cx="82" cy="70" r="34" stroke="var(--nx-primary)" stroke-width="8" fill="none" opacity=".35"/>
      <circle cx="82" cy="70" r="12" fill="var(--nx-primary)"/>
      <circle cx="130" cy="96" r="20" stroke="var(--nx-primary)" stroke-width="7" fill="none" opacity=".6"/>
      <circle cx="130" cy="96" r="7" fill="var(--nx-primary)" opacity=".8"/>
      <path d="M82 24v-10M82 126v-10M36 70H26M138 70h-10" stroke="var(--nx-primary)" stroke-width="6" stroke-linecap="round" opacity=".45"/>
    </svg>

    <div class="nx-error-code" style="font-size:72px"><i class="bi bi-cone-striped"></i></div>
    <h1>Scheduled maintenance</h1>
    <p>We are upgrading the billing database. NexaDash will be read-only until the work is finished &mdash; no data will be lost.</p>

    <div class="nx-countdown" id="countdown">
      <div class="nx-cd-box"><div class="nx-cd-num" id="cdHours">01</div><div class="nx-cd-label">Hours</div></div>
      <div class="nx-cd-box"><div class="nx-cd-num" id="cdMinutes">42</div><div class="nx-cd-label">Minutes</div></div>
      <div class="nx-cd-box"><div class="nx-cd-num" id="cdSeconds">18</div><div class="nx-cd-label">Seconds</div></div>
    </div>

    <div class="d-flex flex-wrap gap-2 justify-content-center">
      <a class="btn btn-primary d-inline-flex align-items-center gap-1" href="../pages/faq.html"><i class="bi bi-activity"></i>View status page</a>
      <a class="btn btn-soft-secondary d-inline-flex align-items-center gap-1" href="../apps/mail.html"><i class="bi bi-envelope"></i>Notify me when it's back</a>
    </div>

    <p class="text-muted small mt-4 mb-0">Window: September 12, 2026 &middot; 02:00&ndash;04:00 UTC</p>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
