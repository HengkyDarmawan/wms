<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>401 Not Authorized | NexaDash</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <link href="../assets/css/variables.css" rel="stylesheet">
  <link href="../assets/css/layout.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/pages.css" rel="stylesheet">
  <link href="../assets/css/motion.css" rel="stylesheet">
  <link href="../assets/css/dark.css" rel="stylesheet">
  <script src="../assets/js/theme-init.js"></script>
</head>
<body class="" data-nx-root="../">

  <main class="nx-error-page">
    <a class="d-inline-flex align-items-center gap-2 text-decoration-none mb-4" href="../index.html">
      <img src="../assets/img/logo.svg" alt="" width="32" height="32">
      <span class="h4 mb-0" style="color:var(--nx-text)">NexaDash</span>
    </a>

    <svg width="200" height="140" viewBox="0 0 200 140" fill="none" aria-hidden="true">
      <rect x="58" y="62" width="84" height="60" rx="10" fill="var(--nx-warning-subtle)"/>
      <path d="M74 62V44a26 26 0 0 1 52 0v18" stroke="var(--nx-warning)" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="100" cy="88" r="9" fill="var(--nx-warning)"/>
      <rect x="96" y="94" width="8" height="16" rx="4" fill="var(--nx-warning)"/>
    </svg>

    <div class="nx-error-code" style="color:var(--nx-warning)">401</div>
    <h1>You are not authorised</h1>
    <p>Your account is signed in, but this page needs a permission your role does not have. An admin can grant it from Roles &amp; Permissions.</p>

    <div class="d-flex flex-wrap gap-2 justify-content-center mt-3">
      <a class="btn btn-primary d-inline-flex align-items-center gap-1" href="../index.html"><i class="bi bi-house-door"></i>Back to dashboard</a>
      <a class="btn btn-soft-secondary d-inline-flex align-items-center gap-1" href="../apps/tickets.html"><i class="bi bi-life-preserver"></i>Request access</a>
      <a class="btn btn-soft-secondary d-inline-flex align-items-center gap-1" href="../auth/login.html"><i class="bi bi-box-arrow-right"></i>Switch account</a>
    </div>

    <p class="text-muted small mt-4 mb-0">Required permission: <code>billing.read</code> &middot; your role: <code>Editor</code></p>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="../assets/js/app.js"></script>
</body>
</html>
