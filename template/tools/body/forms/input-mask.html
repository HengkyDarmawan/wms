      <div class="row g-4">

        <div class="col-lg-6"><div class="card h-100"><div class="card-header"><h2 class="card-title h4">Contact &amp; identity</h2></div><div class="card-body">
          <div class="mb-3"><label class="form-label" for="mkPhoneId">Indonesian phone</label>
            <div class="input-group"><span class="input-group-text">+62</span><input class="form-control" id="mkPhoneId" placeholder="___-____-____"></div>
            <div class="form-text">Mask: <code>999-9999-9999</code></div>
          </div>
          <div class="mb-3"><label class="form-label" for="mkPhoneUs">US phone</label><input class="form-control" id="mkPhoneUs" placeholder="(___) ___-____"></div>
          <div class="mb-3"><label class="form-label" for="mkNik">National ID (16 digits)</label><input class="form-control" id="mkNik" placeholder="____ ____ ____ ____"></div>
          <div class="mb-0"><label class="form-label" for="mkNpwp">Tax number</label><input class="form-control" id="mkNpwp" placeholder="__.___.___._-___.___"></div>
        </div></div></div>

        <div class="col-lg-6"><div class="card h-100"><div class="card-header"><h2 class="card-title h4">Payment</h2></div><div class="card-body">
          <div class="mb-3"><label class="form-label" for="mkCard">Card number</label>
            <div class="input-group">
              <input class="form-control" id="mkCard" placeholder="____ ____ ____ ____">
              <span class="input-group-text" id="cardBrand" style="min-width:64px"><i class="bi bi-credit-card"></i></span>
            </div>
            <div class="form-text">Start with 4 for Visa, 5 for Mastercard, 3 for Amex.</div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6"><label class="form-label" for="mkExpiry">Expiry</label><input class="form-control" id="mkExpiry" placeholder="MM/YY"></div>
            <div class="col-6"><label class="form-label" for="mkCvv">CVV</label><input class="form-control" id="mkCvv" placeholder="___"></div>
          </div>
          <div class="mb-0"><label class="form-label" for="mkIban">IBAN</label><input class="form-control" id="mkIban" placeholder="__## #### #### #### #### ##"></div>
        </div></div></div>

        <div class="col-lg-6"><div class="card h-100"><div class="card-header"><h2 class="card-title h4">Date &amp; time</h2></div><div class="card-body">
          <div class="mb-3"><label class="form-label" for="mkDate">Date</label><input class="form-control" id="mkDate" placeholder="dd/mm/yyyy"></div>
          <div class="mb-3"><label class="form-label" for="mkDateTime">Date &amp; time</label><input class="form-control" id="mkDateTime" placeholder="dd/mm/yyyy hh:mm"></div>
          <div class="mb-0"><label class="form-label" for="mkTime">Time (24h)</label><input class="form-control" id="mkTime" placeholder="hh:mm"></div>
        </div></div></div>

        <div class="col-lg-6"><div class="card h-100"><div class="card-header"><h2 class="card-title h4">Numeric &amp; currency</h2></div><div class="card-body">
          <div class="mb-3"><label class="form-label" for="mkIdr">Rupiah</label>
            <div class="input-group"><span class="input-group-text">Rp</span><input class="form-control text-end" id="mkIdr" value="1.000.000"></div>
          </div>
          <div class="mb-3"><label class="form-label" for="mkUsd">US dollars</label>
            <div class="input-group"><span class="input-group-text">$</span><input class="form-control text-end" id="mkUsd" value="2,391.12"></div>
          </div>
          <div class="mb-3"><label class="form-label" for="mkPercent">Percentage</label>
            <div class="input-group"><input class="form-control text-end" id="mkPercent" value="12.50"><span class="input-group-text">%</span></div>
          </div>
          <div class="mb-0"><label class="form-label" for="mkIp">IP address</label><input class="form-control" id="mkIp" placeholder="___.___.___.___"></div>
        </div></div></div>

      </div>
