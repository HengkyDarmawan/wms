      <div class="row g-4">

        <div class="col-lg-6"><div class="card h-100"><div class="card-header"><h2 class="card-title h4">Horizontal form</h2></div><div class="card-body">
          <form>
            <div class="row mb-3"><label class="col-sm-3 col-form-label" for="hfName">Full name</label><div class="col-sm-9"><input class="form-control" id="hfName" placeholder="Aigars Silkalns"></div></div>
            <div class="row mb-3"><label class="col-sm-3 col-form-label" for="hfEmail">Email</label><div class="col-sm-9"><input class="form-control" type="email" id="hfEmail" placeholder="name@company.com"></div></div>
            <div class="row mb-3"><label class="col-sm-3 col-form-label" for="hfRole">Role</label><div class="col-sm-9"><select class="form-select" id="hfRole"><option>Admin</option><option>Editor</option><option>Viewer</option></select></div></div>
            <div class="row mb-3"><div class="col-sm-9 offset-sm-3"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="hfNotify" checked><label class="form-check-label" for="hfNotify">Email me about account activity</label></div></div></div>
            <div class="row"><div class="col-sm-9 offset-sm-3 d-flex gap-2"><button class="btn btn-primary" type="button">Save</button><button class="btn btn-soft-secondary" type="reset">Cancel</button></div></div>
          </form>
        </div></div></div>

        <div class="col-lg-6"><div class="card h-100"><div class="card-header"><h2 class="card-title h4">Two-column grid</h2></div><div class="card-body">
          <form class="row g-3">
            <div class="col-md-6"><label class="form-label" for="gfFirst">First name</label><input class="form-control" id="gfFirst"></div>
            <div class="col-md-6"><label class="form-label" for="gfLast">Last name</label><input class="form-control" id="gfLast"></div>
            <div class="col-12"><label class="form-label" for="gfAddr">Address</label><input class="form-control" id="gfAddr" placeholder="1234 Main St"></div>
            <div class="col-md-5"><label class="form-label" for="gfCity">City</label><input class="form-control" id="gfCity"></div>
            <div class="col-md-4"><label class="form-label" for="gfState">State</label><select class="form-select" id="gfState"><option>Texas</option><option>California</option><option>New York</option></select></div>
            <div class="col-md-3"><label class="form-label" for="gfZip">ZIP</label><input class="form-control" id="gfZip"></div>
            <div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="button">Submit</button><button class="btn btn-soft-secondary" type="reset">Reset</button></div>
          </form>
        </div></div></div>

        <div class="col-12"><div class="card"><div class="card-header"><h2 class="card-title h4">Inline filter bar</h2></div><div class="card-body">
          <form class="row g-2 align-items-end">
            <div class="col-md-3"><label class="form-label" for="ifSearch">Search</label><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input class="form-control" id="ifSearch" placeholder="Keyword"></div></div>
            <div class="col-md-2"><label class="form-label" for="ifStatus">Status</label><select class="form-select" id="ifStatus"><option>All</option><option>Active</option><option>Paused</option></select></div>
            <div class="col-md-2"><label class="form-label" for="ifOwner">Owner</label><select class="form-select" id="ifOwner"><option>Anyone</option><option>Me</option><option>My team</option></select></div>
            <div class="col-md-2"><label class="form-label" for="ifFrom">From</label><input class="form-control" type="date" id="ifFrom"></div>
            <div class="col-md-2"><label class="form-label" for="ifTo">To</label><input class="form-control" type="date" id="ifTo"></div>
            <div class="col-md-1 d-grid"><button class="btn btn-primary" type="button"><i class="bi bi-funnel"></i></button></div>
          </form>
        </div></div></div>

        <div class="col-lg-8"><div class="card h-100">
          <div class="card-header"><h2 class="card-title h4">Sectioned form</h2></div>
          <div class="card-body">
            <h3 class="h6 text-muted mb-3">Profile</h3>
            <div class="row g-3 mb-4">
              <div class="col-md-6"><label class="form-label" for="sfName">Display name</label><input class="form-control" id="sfName" value="Aigars S."></div>
              <div class="col-md-6"><label class="form-label" for="sfTitle">Job title</label><input class="form-control" id="sfTitle" value="Administrator"></div>
              <div class="col-12"><label class="form-label" for="sfBio">Bio</label><textarea class="form-control" id="sfBio" rows="2">Building dashboards people actually enjoy using.</textarea></div>
            </div>
            <hr class="my-4">
            <h3 class="h6 text-muted mb-3">Workspace</h3>
            <div class="row g-3 mb-4">
              <div class="col-md-6"><label class="form-label" for="sfWs">Workspace name</label><input class="form-control" id="sfWs" value="Nexa Product"></div>
              <div class="col-md-6"><label class="form-label" for="sfRegion">Region</label><select class="form-select" id="sfRegion"><option>eu-west-1</option><option>us-east-1</option></select></div>
            </div>
            <hr class="my-4">
            <h3 class="h6 text-muted mb-3">Preferences</h3>
            <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" role="switch" id="sfDigest" checked><label class="form-check-label" for="sfDigest">Weekly digest email</label></div>
            <div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="sfBeta"><label class="form-check-label" for="sfBeta">Join the beta programme</label></div>
          </div>
          <div class="card-footer d-flex justify-content-end gap-2">
            <button class="btn btn-soft-secondary" type="button">Cancel</button>
            <button class="btn btn-primary" type="button">Save changes</button>
          </div>
        </div></div>

        <div class="col-lg-4"><div class="card h-100"><div class="card-header"><h2 class="card-title h4">Stacked card form</h2></div><div class="card-body">
          <div class="mb-3"><label class="form-label" for="scEmail">Email</label><input class="form-control" type="email" id="scEmail" placeholder="name@company.com"></div>
          <div class="mb-3"><label class="form-label" for="scPass">Password</label><input class="form-control" type="password" id="scPass" placeholder="••••••••"></div>
          <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="scRemember" checked><label class="form-check-label" for="scRemember">Keep me signed in</label></div>
          <button class="btn btn-primary w-100" type="button">Sign in</button>
        </div></div></div>

      </div>
