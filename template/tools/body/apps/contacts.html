      <div class="card mb-4">
        <div class="card-body d-flex flex-wrap align-items-center gap-3">
          <div class="input-group" style="max-width:320px">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input class="form-control" type="search" id="contactSearch" placeholder="Search name, company or email" aria-label="Search contacts">
          </div>
          <select class="form-select" style="max-width:180px" id="contactDept" aria-label="Filter by department">
            <option value="">All departments</option>
            <option>Product</option><option>Engineering</option><option>Design</option>
            <option>Support</option><option>Sales</option><option>Data</option>
          </select>
          <div class="btn-group btn-group-sm ms-auto" role="group" aria-label="View mode">
            <button class="btn btn-outline-primary active" id="cvGrid" type="button" aria-label="Grid view"><i class="bi bi-grid-3x3-gap"></i></button>
            <button class="btn btn-outline-primary" id="cvTable" type="button" aria-label="Table view"><i class="bi bi-list-ul"></i></button>
          </div>
          <span class="small text-muted"><strong id="contactCount">0</strong> contacts</span>
        </div>
      </div>

      <div class="row g-4" id="contactGrid"></div>

      <div class="card d-none" id="contactTable">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead><tr><th>Name</th><th>Company</th><th>Department</th><th>Phone</th><th>Location</th><th class="text-end">Action</th></tr></thead>
            <tbody id="contactTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- ===== Add contact modal ===== -->
      <div class="modal fade" id="contactModal" tabindex="-1" aria-labelledby="contactModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="contactModalTitle">Add contact</h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-md-6"><label class="form-label" for="ncName">Full name</label><input class="form-control" id="ncName" placeholder="Jane Cooper"></div>
                <div class="col-md-6"><label class="form-label" for="ncRole">Job title</label><input class="form-control" id="ncRole" placeholder="Product Manager"></div>
                <div class="col-md-6"><label class="form-label" for="ncCompany">Company</label><input class="form-control" id="ncCompany" placeholder="Orbit Labs"></div>
                <div class="col-md-6"><label class="form-label" for="ncDept">Department</label>
                  <select class="form-select" id="ncDept"><option>Product</option><option>Engineering</option><option>Design</option><option>Support</option><option>Sales</option><option>Data</option></select>
                </div>
                <div class="col-md-6"><label class="form-label" for="ncEmail">Email</label><input class="form-control" type="email" id="ncEmail" placeholder="jane@company.com"></div>
                <div class="col-md-6"><label class="form-label" for="ncPhone">Phone</label><input class="form-control" id="ncPhone" placeholder="+65 8123 4455"></div>
                <div class="col-12"><label class="form-label" for="ncCity">Location</label><input class="form-control" id="ncCity" placeholder="Singapore"></div>
              </div>
            </div>
            <div class="modal-footer"><button class="btn btn-soft-secondary" data-bs-dismiss="modal" type="button">Cancel</button><button class="btn btn-primary" id="ncSave" type="button">Save contact</button></div>
          </div>
        </div>
      </div>
