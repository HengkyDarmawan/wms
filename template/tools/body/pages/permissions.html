      <div class="card mb-4">
        <div class="card-body d-flex flex-wrap align-items-center gap-3">
          <div class="input-group" style="max-width:280px">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input class="form-control" type="search" id="pmSearch" placeholder="Find a permission&hellip;" aria-label="Find a permission">
          </div>
          <select class="form-select" style="max-width:180px" id="pmRole" aria-label="Highlight a role">
            <option value="">Highlight no role</option>
            <option>Owner</option><option>Admin</option><option>Editor</option><option>Analyst</option><option>Support</option><option>Viewer</option>
          </select>
          <div class="ms-auto d-flex gap-2">
            <button class="btn btn-sm btn-soft-secondary" id="pmReset" type="button"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset</button>
            <button class="btn btn-sm btn-primary" id="pmSave" type="button" disabled><i class="bi bi-check2 me-1"></i>Save matrix</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="pmTable">
            <thead>
              <tr>
                <th style="min-width:260px">Permission</th>
                <th class="text-center">Owner</th>
                <th class="text-center">Admin</th>
                <th class="text-center">Editor</th>
                <th class="text-center">Analyst</th>
                <th class="text-center">Support</th>
                <th class="text-center">Viewer</th>
              </tr>
            </thead>
            <tbody id="pmBody"></tbody>
          </table>
        </div>
        <div class="card-footer d-flex flex-wrap gap-3 align-items-center">
          <span class="small text-muted"><strong id="pmGranted">0</strong> of <span id="pmTotal">0</span> checkboxes granted</span>
          <div class="ms-auto d-flex flex-wrap gap-3 small text-muted">
            <span><i class="bi bi-check-square text-success me-1"></i>Granted</span>
            <span><i class="bi bi-square me-1"></i>Not granted</span>
            <span><i class="bi bi-lock text-muted me-1"></i>Locked for Owner</span>
          </div>
        </div>
      </div>
